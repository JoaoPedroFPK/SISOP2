# Default cluster configuration for file synchronization system
# This file defines the server cluster topology and settings

[cluster]
total_servers=3
replication_factor=2
frontend_address=127.0.0.1
frontend_port=8000
heartbeat_interval=2000
election_timeout=5000
replication_timeout=10000
connection_timeout=5000

[server_1]
id=1
address=127.0.0.1
port=8001
priority=3

[server_2]
id=2
address=127.0.0.1
port=8002
priority=2

[server_3]
id=3
address=127.0.0.1
port=8003
priority=1 